name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      COOKED_TEST_DATABASE_URL: postgres://cooked:cooked@localhost:5432/cooked_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start system PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set ON_ERROR_STOP=1 --command "CREATE USER cooked WITH PASSWORD 'cooked'"
          sudo -u postgres createdb --owner cooked cooked_test
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...
