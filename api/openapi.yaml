openapi: 3.1.0
info:
  title: Cooked API
  version: 1.0.0-m2
  description: Contract for the Cooked v1 API. Product behavior is defined in product-frd.md.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Authentication
  - name: Profiles
  - name: Administration
  - name: Media
  - name: Discovery
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      servers:
        - url: /
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      servers:
        - url: /
      responses:
        "200":
          description: The database is reachable and migrations are current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; verification email queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/verify-email:
    get:
      tags: [Authentication]
      operationId: verifyEmail
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. Unverified accounts receive tokens but remain subject to verified-only authorization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Rotated token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Refresh token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
  /auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutAll
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: All token-family sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/forgot-password:
    post:
      tags: [Authentication]
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Generic accepted response, regardless of account existence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/reset-password:
    post:
      tags: [Authentication]
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset and outstanding reset credentials invalidated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/google/start:
    post:
      tags: [Authentication]
      operationId: startGoogleSignIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [return_url]
              properties:
                return_url: {type: string, format: uri}
      responses:
        "200": {description: PKCE authorization URL created, content: {application/json: {schema: {$ref: "#/components/schemas/SuccessResponse"}}}}
        "400": {$ref: "#/components/responses/ValidationError"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /auth/google/callback:
    get:
      tags: [Authentication]
      operationId: completeGoogleCallback
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, required: true, schema: {type: string}}
      responses:
        "302": {description: Redirects to the allow-listed client return URL with a short-lived one-time code.}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /auth/google/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeGoogleLoginCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: {code: {type: string, minLength: 32}}
      responses:
        "200": {description: Cooked token pair issued, content: {application/json: {schema: {$ref: "#/components/schemas/LoginResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /users/me:
    get:
      tags: [Profiles]
      operationId: getCurrentUser
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Current private profile, content: {application/json: {schema: {$ref: "#/components/schemas/SuccessResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
    patch:
      tags: [Profiles]
      operationId: updateCurrentUser
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileUpdate"}
      responses:
        "200": {description: Updated private profile, content: {application/json: {schema: {$ref: "#/components/schemas/SuccessResponse"}}}}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    delete:
      tags: [Profiles]
      operationId: anonymizeCurrentUser
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Sessions revoked and account anonymized.}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /users/me/dietary-preferences:
    put:
      tags: [Profiles]
      operationId: replaceDietaryPreferences
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slugs]
              properties:
                slugs: {type: array, uniqueItems: true, maxItems: 20, items: {type: string}}
      responses:
        "200": {description: Preferences replaced; an empty array represents none, content: {application/json: {schema: {$ref: "#/components/schemas/SuccessResponse"}}}}
        "400": {$ref: "#/components/responses/ValidationError"}
  /profiles/{username}:
    get:
      tags: [Profiles]
      operationId: getPublicProfile
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Public profile, content: {application/json: {schema: {$ref: "#/components/schemas/SuccessResponse"}}}}
        "404": {description: Profile not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
  /admin/users/{id}/roles/{role}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: role, in: path, required: true, schema: {type: string, enum: [moderator, admin]}}
    put:
      tags: [Administration]
      operationId: grantUserRole
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/RoleChange"}
      responses:
        "200": {description: Role granted and audited.}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      tags: [Administration]
      operationId: revokeUserRole
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/RoleChange"}
      responses:
        "200": {description: Role revoked and audited.}
        "409": {$ref: "#/components/responses/Conflict"}
  /media/uploads:
    post:
      tags: [Media]
      operationId: initializeMediaUpload
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MediaUploadRequest"}
      responses:
        "201": {description: Short-lived signed upload URL created.}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /media/{id}/complete:
    post:
      tags: [Media]
      operationId: completeMediaUpload
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "202": {description: Object found and queued for validation and processing.}
        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {description: Media asset not found.}
  /media/{id}:
    get:
      tags: [Media]
      operationId: getPublicMedia
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Ready and approved public media with short-lived delivery URLs.}
        "404": {description: Missing, private, quarantined, pending, or failed media.}
  /media/{id}/access:
    get:
      tags: [Media]
      operationId: getOwnedMedia
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Owner view, including processing and moderation state.}
        "404": {description: Media asset is not owned by the caller.}
  /delicacies:
    get:
      tags: [Dishes]
      operationId: listPublishedDishes
      parameters:
        - {name: category, in: query, schema: {type: string}}
        - {name: region, in: query, schema: {type: string}}
      responses:
        "200": {description: Published dishes only, optionally filtered by category and region.}
    post:
      tags: [Dishes]
      operationId: submitDish
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/DishWrite"}
      responses:
        "201": {description: Pending Dish submitted.}
        "409": {description: Similar dishes; review details and explicitly confirm before resubmitting.}
  /delicacies/duplicate-suggestions:
    get:
      tags: [Dishes]
      operationId: suggestDuplicateDishes
      parameters:
        - {name: name, in: query, required: true, schema: {type: string, minLength: 3}}
      responses:
        "200": {description: Exact and trigram-ranked name/alias matches.}
  /delicacies/{id}:
    get:
      tags: [Dishes]
      operationId: getPublishedDish
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Published Dish; retired identifiers resolve to their merge target.}
        "404": {description: Dish is absent or not published.}
    patch:
      tags: [Dishes]
      operationId: editPendingDish
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {$ref: "#/components/requestBodies/DishWrite"}
      responses:
        "200": {description: Submitter-owned pending Dish updated.}
  /delicacies/{id}/withdraw:
    post:
      tags: [Dishes]
      operationId: withdrawPendingDish
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Pending Dish withdrawn by its submitter.}
  /staff/delicacies:
    get:
      tags: [Moderation]
      operationId: listPendingDishes
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Pending moderation queue.}
    post:
      tags: [Moderation]
      operationId: createPublishedDish
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/DishWrite"}
      responses:
        "201": {description: Published Dish created and audited.}
  /staff/delicacies/{id}/approve:
    post:
      tags: [Moderation]
      operationId: approveDish
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {$ref: "#/components/requestBodies/ModerationReason"}
      responses: {"204": {description: Dish published, submitter notified, action audited.}}
  /staff/delicacies/{id}/reject:
    post:
      tags: [Moderation]
      operationId: rejectDish
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {$ref: "#/components/requestBodies/ModerationReason"}
      responses: {"204": {description: Dish rejected, submitter notified, action audited.}}
  /admin/delicacies/{id}/merge:
    post:
      tags: [Administration]
      operationId: mergeDish
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"204": {description: Source merged into target transactionally and audited.}}
  /taxonomies:
    get:
      tags: [Dishes]
      operationId: listTaxonomies
      responses: {"200": {description: Active categories, regions, dietary tags, and measurement units.}}
  /recipes:
    post:
      tags: [Recipes]
      operationId: createRecipeDraft
      security: [{bearerAuth: []}]
      requestBody: {$ref: "#/components/requestBodies/RecipeCreate"}
      responses: {"201": {description: Stable Recipe identity and its first private draft created.}}
  /recipes/{id}:
    get:
      tags: [Recipes]
      operationId: getCurrentRecipe
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: servings, in: query, schema: {type: integer, minimum: 1}}
      responses: {"200": {description: Current accessible published version with projected ingredient scaling.}, "404": {description: Missing or inaccessible Recipe.}}
    delete:
      tags: [Recipes]
      operationId: softDeleteRecipe
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"204": {description: Recipe soft-deleted.}}
  /recipe-versions/{id}:
    get:
      tags: [Recipes]
      operationId: getRecipeVersion
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: servings, in: query, schema: {type: integer, minimum: 1}}
      responses: {"200": {description: Accessible immutable version with outdated marker.}}
  /recipes/{id}/draft:
    get:
      tags: [Recipes]
      operationId: getOrCreateRecipeDraft
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Existing draft or a draft cloned from the current version.}}
    put:
      tags: [Recipes]
      operationId: replaceRecipeDraft
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {$ref: "#/components/requestBodies/RecipeSnapshot"}
      responses: {"200": {description: Mutable draft snapshot replaced.}}
  /recipes/{id}/publish:
    post:
      tags: [Recipes]
      operationId: publishRecipeDraft
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses: {"200": {description: Draft atomically published and made current.}, "409": {$ref: "#/components/responses/Conflict"}}
  /recipes/{id}/visibility:
    patch:
      tags: [Recipes]
      operationId: changeRecipeVisibility
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"204": {description: Visibility changed without mutating version content.}}
  /search:
    get:
      tags: [Discovery]
      operationId: searchPublicContent
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: dish_cursor, in: query, schema: {type: string}}
        - {name: recipe_cursor, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/Limit"}
        - {name: dietary, in: query, schema: {type: string}}
        - {name: difficulty, in: query, schema: {type: string, enum: [easy, medium, hard]}}
        - {name: max_total_time_seconds, in: query, schema: {type: integer, minimum: 0}}
        - {name: category, in: query, schema: {type: string}}
        - {name: region, in: query, schema: {type: string}}
      responses: {"200": {description: Cursor-paginated public Dish and current Recipe results.}, "400": {$ref: "#/components/responses/ValidationError"}}
  /browse/dishes:
    get:
      tags: [Discovery]
      operationId: browseDishes
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
        - {name: category, in: query, schema: {type: string}}
        - {name: region, in: query, schema: {type: string}}
      responses: {"200": {description: Public Dishes grouped through category and region filters.}}
  /discovery/recent-dishes:
    get:
      tags: [Discovery]
      operationId: listRecentDishes
      parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {description: Recently approved public Dishes.}}
  /discovery/recommendations:
    get:
      tags: [Discovery]
      operationId: listDietaryRecommendations
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {description: Public current Recipes matching any private dietary preference.}}
  /users/me/favorites:
    get:
      tags: [Discovery]
      operationId: listFavorites
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses: {"200": {description: Accessible saved Recipes; inaccessible saves disclose no metadata.}}
  /recipes/{id}/favorite:
    put:
      tags: [Discovery]
      operationId: saveRecipe
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"204": {description: Accessible Recipe saved idempotently.}, "404": {description: Recipe missing or inaccessible.}}
    delete:
      tags: [Discovery]
      operationId: unsaveRecipe
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"204": {description: Recipe unsaved idempotently.}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
  requestBodies:
    RecipeCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [delicacy_id, snapshot]
            properties:
              delicacy_id: {type: string, format: uuid}
              visibility: {type: string, enum: [public, unlisted, private], default: private}
              snapshot: {$ref: "#/components/schemas/RecipeSnapshot"}
    RecipeSnapshot:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RecipeSnapshot"}
    DishWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, description, category_id, region_ids]
            properties:
              name: {type: string, minLength: 3, maxLength: 255}
              description: {type: string, minLength: 3}
              category_id: {type: string, format: uuid}
              region_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}
              aliases: {type: array, uniqueItems: true, items: {type: string}}
              country_codes: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Za-z]{2}$"}}
              origin_notes: {type: string}
              cover_media_id: {type: string, format: uuid}
              confirm_similar: {type: boolean, default: false}
    ModerationReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties: {reason: {type: string, minLength: 3}}
    RoleChange:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties: {reason: {type: string, minLength: 3, maxLength: 1000}}
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed or is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated account lacks the required verification or role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The command conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required dependency or migration is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RecipeSnapshot:
      type: object
      required: [title, ingredients, steps]
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        summary: {type: string, maxLength: 512}
        base_servings: {type: integer, minimum: 1}
        prep_time_seconds: {type: integer, minimum: 0}
        cook_time_seconds: {type: integer, minimum: 0}
        difficulty: {type: string, enum: [easy, medium, hard]}
        notes: {type: string}
        ingredients: {type: array, items: {type: object}}
        steps: {type: array, items: {type: object}}
        tag_ids: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
        cover_media_ids: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
    MediaUploadRequest:
      type: object
      additionalProperties: false
      required: [purpose, mime_type, byte_size, access_scope]
      properties:
        purpose: {type: string, enum: [profile_avatar, dish_cover, recipe_cover, step_image, review_photo, cook_session_photo]}
        filename: {type: string, maxLength: 255}
        mime_type: {type: string, enum: [image/jpeg, image/png]}
        byte_size: {type: integer, minimum: 1, maximum: 5242880}
        access_scope: {type: string, enum: [public, private]}
    Meta:
      type: object
      required: [timestamp]
      properties:
        request_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        next_cursor:
          type: string
    SuccessResponse:
      type: object
      required: [status, meta, data]
      properties:
        status:
          const: success
        meta:
          $ref: "#/components/schemas/Meta"
        data: {}
    ErrorResponse:
      type: object
      required: [status, meta, error]
      properties:
        status:
          const: error
        meta:
          $ref: "#/components/schemas/Meta"
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
    User:
      type: object
      required: [id, email, name, user_name, is_verified, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        user_name:
          type: string
        is_verified:
          type: boolean
        picture:
          type: string
          format: uri
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [user, moderator, admin]
        bio: {type: [string, "null"], maxLength: 1024}
        avatar_media_id: {type: [string, "null"], format: uuid}
        timezone: {type: string, description: IANA timezone name}
        dietary_preferences:
          type: array
          items: {$ref: "#/components/schemas/DietaryTag"}
        xp_total: {type: integer, minimum: 0}
        current_streak: {type: integer, minimum: 0}
        longest_streak: {type: integer, minimum: 0}
    DietaryTag:
      type: object
      required: [id, name, slug]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string, enum: [vegetarian, vegan, halal, pescatarian]}
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 3, maxLength: 32}
        user_name: {type: string, pattern: "^[A-Za-z0-9]+$", minLength: 3, maxLength: 24}
        bio: {type: [string, "null"], maxLength: 1024}
        timezone: {type: string, maxLength: 64}
        avatar_media_id: {type: [string, "null"], format: uuid}
    TokenPair:
      type: object
      required: [access_token, refresh_token, access_token_expiry]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        access_token_expiry:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, user_name, email, password]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 32
        user_name:
          type: string
          pattern: "^[A-Za-z0-9]+$"
          minLength: 3
          maxLength: 24
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 32
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [otp, email, password]
      properties:
        otp:
          type: string
          pattern: "^[0-9]{6}$"
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    RegisterResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              type: object
              required: [user, message]
              properties:
                user:
                  $ref: "#/components/schemas/User"
                message:
                  type: string
    UserResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              type: object
              required: [user, message]
              properties:
                user:
                  $ref: "#/components/schemas/User"
                message:
                  type: string
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              type: object
              required: [user, tokens]
              properties:
                user:
                  $ref: "#/components/schemas/User"
                tokens:
                  $ref: "#/components/schemas/TokenPair"
    TokenResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              type: object
              required: [access_token, refresh_token]
              properties:
                access_token:
                  type: string
                refresh_token:
                  type: string
